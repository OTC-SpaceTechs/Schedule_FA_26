<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Techs — Flight Data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- colors ---------- */
      :root {
        --navy-deep: #12183a;
        --teal: #4fc3a1;
        --gold: #f0c674;
        --coral: #e8896b;
        --starlight: #eaf2ff;
        --dim: rgba(234, 242, 255, 0.65);
        --glass: rgba(20, 27, 58, 0.5);
        --hair: rgba(234, 242, 255, 0.22);
      }

      /* ---------- base ---------- */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: "Inter", sans-serif;
        color: var(--starlight);
        background: #050818;
        display: flex;
        justify-content: center;
        padding: 40px 18px;
      }

      a {
        color: var(--teal);
        text-decoration: none;
        border-bottom: 1px solid rgba(79, 195, 161, 0.5);
      }
      a:hover {
        border-bottom-color: var(--teal);
      }

      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
        border-radius: 2px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* ---------- nebula backdrop ---------- */
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: var(--navy-deep);
      }
      .backdrop img {
        position: absolute;
        top: 50%;
        left: 50%;
        height: 100vw;
        width: auto;
        max-width: none;
        transform: translate(-50%, -50%) rotate(90deg);
      }

      /* ---------- page frame ---------- */
      .page {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 960px;
        background: rgba(10, 14, 36, 0.72);
        backdrop-filter: blur(10px);
        border: 1px solid var(--hair);
        border-radius: 10px;
        padding: 0.7in 0.65in 0.55in;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 18px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11.5px;
        letter-spacing: 0.06em;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 12px;
        border-bottom: 1px solid var(--hair);
        padding-bottom: 16px;
        margin-bottom: 22px;
      }

      h1 {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.01em;
      }
      h1 .accent {
        color: var(--teal);
      }

      .manifest-note {
        font-size: 12px;
        color: rgba(234, 242, 255, 0.75);
        max-width: 2.3in;
        text-align: right;
        line-height: 1.4;
      }

      footer {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--hair);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      footer .tagline {
        font-family: "Space Grotesk", sans-serif;
        font-size: 12.5px;
        color: rgba(234, 242, 255, 0.75);
      }

      /* ---------- section headings ---------- */
      .section-block + .section-block {
        margin-top: 32px;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }
      .section-label .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 8px var(--gold);
      }
      .section-label .dot.teal {
        background: var(--teal);
        box-shadow: 0 0 8px var(--teal);
      }
      .section-label .dot.coral {
        background: var(--coral);
        box-shadow: 0 0 8px var(--coral);
      }
      .name {
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--gold);
      }

      /* ---------- flight record cards ---------- */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-top: 10px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
        padding: 14px 16px;
        background: var(--glass);
        border: 1px solid var(--hair);
        border-radius: 6px;
        color: var(--starlight);
        font: inherit;
        cursor: pointer;
      }
      .card:hover {
        border-color: var(--teal);
      }
      .card-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .card-value {
        font-family: "Space Grotesk", sans-serif;
        font-size: 26px;
        font-weight: 600;
      }
      .card-value small {
        font-size: 13px;
        color: var(--dim);
      }
      .card-alt,
      .card-time {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--dim);
      }

      /* ---------- charts ---------- */
      .charts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr));
        gap: 16px;
        margin-top: 10px;
      }
      .chart {
        padding: 14px 16px 10px;
        background: var(--glass);
        border: 1px solid var(--hair);
        border-radius: 6px;
      }
      .chart h3 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .chart h3 small {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        font-weight: 400;
        color: var(--dim);
      }

      .plot {
        position: relative;
        height: 160px;
        margin-left: 52px; /* room for the y-axis numbers */
      }
      .plot svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .plot .line {
        fill: none;
        stroke: var(--teal);
        stroke-width: 1.5;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .plot .grid {
        stroke: rgba(234, 242, 255, 0.12);
        vector-effect: non-scaling-stroke;
      }
      .plot .event {
        stroke: var(--coral);
        stroke-dasharray: 4 4;
        vector-effect: non-scaling-stroke;
      }

      .y-label,
      .x-axis span {
        position: absolute;
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        color: var(--dim);
        white-space: nowrap;
      }
      .y-label {
        right: calc(100% + 8px); /* sits just left of the plot */
        transform: translateY(-50%);
      }
      .x-axis {
        position: relative;
        height: 16px;
        margin: 6px 0 0 52px; /* lines up with .plot */
      }
      .x-axis span {
        transform: translateX(-50%);
      }

      /* ---------- accessibility preferences ---------- */
      @media (prefers-contrast: more) {
        :root {
          --dim: var(--starlight);
          --hair: rgba(234, 242, 255, 0.6);
        }
        .page {
          background: #0a0e24;
          backdrop-filter: none;
        }
        .manifest-note,
        footer .tagline {
          color: var(--starlight);
        }
        a {
          text-decoration: underline;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .page {
          background: #0a0e24;
          backdrop-filter: none;
        }
      }

      /* ---------- phones ---------- */
      @media (max-width: 520px) {
        body {
          padding: 20px 10px;
        }
        .page {
          padding: 28px 16px 22px;
        }
        h1 {
          font-size: 26px;
        }
        header {
          flex-direction: column;
          align-items: flex-start;
        }
        .manifest-note {
          text-align: left;
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <img src="galactic-center.jpg" alt="" />
    </div>

    <div class="page">
      <a class="back-link" href="index.html">&larr; Back to Schedule</a>

      <header>
        <h1>WEATHER <span class="accent">BALLOON</span><br />FLIGHT DATA</h1>
        <div class="manifest-note">
          Launched Oct 4, 2026 - 2 h 6 min from liftoff to touchdown, recorded
          once per second by our onboard sensors.
        </div>
      </header>

      <main>
        <section class="section-block">
          <div class="section-label">
            <span class="dot teal" aria-hidden="true"></span>
            <h2 class="name">Flight Records</h2>
          </div>
          <div id="cards" class="cards"></div>
        </section>

        <section class="section-block">
          <div class="section-label">
            <span class="dot gold" aria-hidden="true"></span>
            <h2 class="name">Flight Charts</h2>
          </div>
          <div id="charts" class="charts"></div>
        </section>
      </main>

      <footer>
        <div class="tagline">Up, up, and away.</div>
      </footer>
    </div>

    <script src="flight_data/flight_data.js"></script>
    <script>
      // ---------- Setup ----------

      const D = FLIGHT_DATA; // short name for the whole data object
      const S = D.series; // S.alt_ft, S.accel, etc. - one value per second
      const LAST = S.alt_ft.length - 1; // index of the final second (7698)

      const METRICS = [
        {
          key: "alt_ft",
          label: "Altitude",
          unit: "ft",
          digits: 0,
          alt: (v) => `${Math.round(v * 0.3048).toLocaleString()} m`,
        },
        {
          key: "accel",
          label: "Acceleration",
          unit: "m/s²",
          digits: 1,
          alt: (v) => `${(v / 9.80665).toFixed(1)} g`,
        },
        { key: "hum", label: "Humidity", unit: "%", digits: 1 },
        { key: "rot", label: "Rotation", unit: "°/s", digits: 0 },
        {
          key: "temp_f",
          label: "Temperature",
          unit: "°F",
          digits: 1,
          alt: (v) => `${(((v - 32) * 5) / 9).toFixed(1)} °C`,
        },
        { key: "pres", label: "Pressure", unit: "hPa", digits: 1 },
      ];

      // ---------- Formatting helpers ----------

      const pad2 = (n) => String(n).padStart(2, "0");

      // 5141 -> "T+1:25:41"
      function formatT(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        return `T+${h}:${pad2(m)}:${pad2(s)}`;
      }

      // 5400 -> "1:30" (hours:minutes, for chart axes)
      function formatClock(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        return `${h}:${pad2(m)}`;
      }

      // Format a number with the right decimal places and thousands commas
      function fmt(m, v) {
        return v.toLocaleString(undefined, {
          minimumFractionDigits: m.digits,
          maximumFractionDigits: m.digits,
        });
      }

      // ---------- Flight record cards ----------

      const cardsEl = document.getElementById("cards");

      for (const m of METRICS) {
        const ex = D.extremes[m.key]; // { t: when, v: value }
        const kind = m.key === "temp_f" || m.key === "pres" ? "Min" : "Max";

        const card = document.createElement("button"); // a button so it can be clicked later
        card.type = "button";
        card.className = "card";
        card.innerHTML = `
          <span class="card-label">${kind} ${m.label}</span>
          <span class="card-value">${fmt(m, ex.v)} <small>${m.unit}</small></span>
          ${m.alt ? `<span class="card-alt">${m.alt(ex.v)}</span>` : ""}
          <span class="card-time">at ${formatT(ex.t)}</span>
        `;
        cardsEl.append(card);
      }

      // ---------- Charts ----------

      // Pick round-number gridlines, e.g. 0, 50, 100, 150
      function niceTicks(lo, hi, count = 4) {
        const rough = (hi - lo) / count;
        const mag = 10 ** Math.floor(Math.log10(rough));
        const step = [1, 2, 5, 10].map((n) => n * mag).find((s) => s >= rough);
        const ticks = [];
        for (let v = Math.floor(lo / step) * step; v < hi + step; v += step) {
          ticks.push(v);
        }
        return ticks;
      }

      function makeChart(m) {
        const data = S[m.key];

        // 1. Gridlines, and the y-range they cover
        const ticks = niceTicks(Math.min(0, ...data), Math.max(...data));
        const yMin = ticks[0];
        const yMax = ticks[ticks.length - 1];

        // 2. Data -> drawing coordinates (the SVG is 1000 wide, 100 tall)
        const x = (t) => (t / LAST) * 1000;
        const y = (v) => 100 - ((v - yMin) / (yMax - yMin)) * 100;

        // 3. One path through every point: "M x,y L x,y L x,y ..."
        const d = data
          .map(
            (v, t) =>
              `${t === 0 ? "M" : "L"}${x(t).toFixed(1)},${y(v).toFixed(2)}`,
          )
          .join("");

        // 4. Pieces of the chart, built as HTML strings
        const gridLines = ticks
          .map(
            (v) =>
              `<line class="grid" x1="0" x2="1000" y1="${y(v)}" y2="${y(v)}" />`,
          )
          .join("");

        const yLabels = ticks
          .map(
            (v) =>
              `<span class="y-label" style="top: ${y(v)}%">${v.toLocaleString()}</span>`,
          )
          .join("");

        const xTicks = [0, 1800, 3600, 5400, 7200]; // every 30 minutes
        const xLabels = xTicks
          .map(
            (t) =>
              `<span style="left: ${(t / LAST) * 100}%">${formatClock(t)}</span>`,
          )
          .join("");

        // 5. Put it together
        const fig = document.createElement("figure");
        fig.className = "chart";
        fig.innerHTML = `
          <h3>${m.label} <small>${m.unit}</small></h3>
          <div class="plot">
            <svg viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
              ${gridLines}
              <line class="event" x1="${x(D.burst)}" x2="${x(D.burst)}" y1="0" y2="100" />
              <path class="line" d="${d}" />
            </svg>
            ${yLabels}
          </div>
          <div class="x-axis">${xLabels}</div>
        `;
        return fig;
      }

      const chartsEl = document.getElementById("charts");
      const CHART_ORDER = ["accel", "rot", "hum", "temp_f", "pres", "alt_ft"];

      for (const key of CHART_ORDER) {
        const metric = METRICS.find((m) => m.key === key);
        chartsEl.append(makeChart(metric));
      }
    </script>
  </body>
</html>
